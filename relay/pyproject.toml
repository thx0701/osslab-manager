[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "osslab-relay"
version = "0.1.0"
description = "Durable local execution for OSSLab manager"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
osrelay = "osrelay.cli:main"

[tool.setuptools.packages.find]
include = ["osrelay*"]
